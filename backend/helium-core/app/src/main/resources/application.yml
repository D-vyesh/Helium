spring:
  application:
    name: helium-core
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${HELIUM_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${HELIUM_DB_URL:jdbc:postgresql://localhost:5432/helium}
    username: ${HELIUM_DB_USERNAME:helium}
    password: ${HELIUM_DB_PASSWORD:helium}
    hikari:
      maximum-pool-size: ${HELIUM_DB_POOL_SIZE:20}
      max-lifetime: ${HELIUM_DB_MAX_LIFETIME_MS:1800000}
  data:
    redis:
      host: ${HELIUM_REDIS_HOST:localhost}
      port: ${HELIUM_REDIS_PORT:6379}
      password: ${HELIUM_REDIS_PASSWORD:}
      timeout: ${HELIUM_REDIS_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true
  mail:
    host: ${HELIUM_SMTP_HOST:localhost}
    port: ${HELIUM_SMTP_PORT:1025}
    username: ${HELIUM_SMTP_USERNAME:}
    password: ${HELIUM_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${HELIUM_SMTP_AUTH:false}
          starttls:
            enable: ${HELIUM_SMTP_STARTTLS:false}

server:
  port: ${HELIUM_HTTP_PORT:8080}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${HELIUM_ENVIRONMENT:local}
  tracing:
    sampling:
      probability: ${HELIUM_TRACE_SAMPLING_PROBABILITY:0.10}

helium:
  environment: ${HELIUM_ENVIRONMENT:local}
  email:
    enabled: ${HELIUM_EMAIL_ENABLED:true}
    from-address: ${HELIUM_EMAIL_FROM:noreply@helium.exchange}
    from-name: ${HELIUM_EMAIL_FROM_NAME:HELIUM Exchange}
    base-url: ${HELIUM_EMAIL_BASE_URL:http://localhost:3000}
  auth:
    totp-encryption-key: ${HELIUM_TOTP_ENCRYPTION_KEY:local-totp-encryption-key-32bytes!!}
    jwt-secret: ${HELIUM_JWT_SECRET:local-development-jwt-secret-change-me-minimum-32-bytes}
  secrets:
    backend: ${HELIUM_SECRETS_BACKEND:environment}
    refresh-interval-ms: ${HELIUM_SECRETS_REFRESH_MS:300000}
  api-keys:
    current-version: ${HELIUM_API_KEY_VERSION:v1}
    current-pepper: ${HELIUM_API_KEY_PEPPER:local-development-api-key-pepper-change-me}
    previous-version: ${HELIUM_API_KEY_PREVIOUS_VERSION:}
    previous-pepper: ${HELIUM_API_KEY_PREVIOUS_PEPPER:}
    signature-ttl: ${HELIUM_API_KEY_SIGNATURE_TTL:5m}
    nonce-ttl: ${HELIUM_API_KEY_NONCE_TTL:10m}
    default-lifetime: ${HELIUM_API_KEY_DEFAULT_LIFETIME:90d}
  outbox:
    enabled: ${HELIUM_OUTBOX_ENABLED:true}
    poll-interval-ms: ${HELIUM_OUTBOX_POLL_INTERVAL_MS:1000}
  wallet:
    chain-monitor:
      enabled: ${HELIUM_WALLET_CHAIN_MONITOR_ENABLED:false}
    custody:
      eth:
        from-address: ${HELIUM_ETH_CUSTODY_ADDRESS:}
      sol:
        fee-payer: ${HELIUM_SOL_FEE_PAYER:}
      vault:
        address: ${HELIUM_VAULT_ADDRESS:}
        token: ${HELIUM_VAULT_TOKEN:}
      offline:
        response-directory: ${HELIUM_OFFLINE_CUSTODY_RESPONSE_DIRECTORY:}
      signing:
        max-retries: ${HELIUM_CUSTODY_SIGNING_MAX_RETRIES:5}
        worker:
          enabled: ${HELIUM_CUSTODY_SIGNING_WORKER_ENABLED:false}
          poll-interval-ms: ${HELIUM_CUSTODY_SIGNING_POLL_INTERVAL_MS:5000}
    builder:
      worker:
        enabled: ${HELIUM_WALLET_BUILDER_WORKER_ENABLED:false}
        poll-interval-ms: ${HELIUM_WALLET_BUILDER_POLL_INTERVAL_MS:5000}
    rpc:
      failure-threshold: ${HELIUM_WALLET_RPC_FAILURE_THRESHOLD:3}
      recovery-timeout-ms: ${HELIUM_WALLET_RPC_RECOVERY_TIMEOUT_MS:30000}
      stale-block-lag: ${HELIUM_WALLET_RPC_STALE_BLOCK_LAG:6}
      btc:
        nodes: ${HELIUM_BTC_RPC_NODES:}
      eth:
        nodes: ${HELIUM_ETH_RPC_NODES:}
      sol:
        nodes: ${HELIUM_SOL_RPC_NODES:}
      health-monitor:
        enabled: ${HELIUM_WALLET_RPC_HEALTH_MONITOR_ENABLED:true}
        poll-interval-ms: ${HELIUM_WALLET_RPC_HEALTH_MONITOR_POLL_INTERVAL_MS:30000}
      consistency:
        allowed-block-lag: ${HELIUM_WALLET_RPC_CONSISTENCY_ALLOWED_BLOCK_LAG:3}
      consistency-monitor:
        enabled: ${HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_ENABLED:true}
        poll-interval-ms: ${HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_POLL_INTERVAL_MS:30000}
    broadcast:
      max-retries: ${HELIUM_WALLET_BROADCAST_MAX_RETRIES:5}
      worker:
        enabled: ${HELIUM_WALLET_BROADCAST_WORKER_ENABLED:false}
        poll-interval-ms: ${HELIUM_WALLET_BROADCAST_POLL_INTERVAL_MS:5000}
    confirmation:
      worker:
        enabled: ${HELIUM_WALLET_CONFIRMATION_WORKER_ENABLED:false}
        poll-interval-ms: ${HELIUM_WALLET_CONFIRMATION_POLL_INTERVAL_MS:15000}
    stuck-monitor:
      enabled: ${HELIUM_WALLET_STUCK_MONITOR_ENABLED:false}
      poll-interval-ms: ${HELIUM_WALLET_STUCK_MONITOR_POLL_INTERVAL_MS:600000}
      threshold-minutes: ${HELIUM_WALLET_STUCK_MONITOR_THRESHOLD_MINUTES:60}
    solana:
      broadcast:
        skip-preflight: ${HELIUM_SOLANA_BROADCAST_SKIP_PREFLIGHT:false}
        commitment: ${HELIUM_SOLANA_BROADCAST_COMMITMENT:processed}
  market-data:
    live:
      enabled: ${HELIUM_MARKET_DATA_LIVE_ENABLED:true}
      rest-base-url: ${HELIUM_BINANCE_REST_BASE_URL:https://api.binance.com}
      websocket-base-url: ${HELIUM_BINANCE_WS_BASE_URL:wss://stream.binance.com:9443}
      symbols: ${HELIUM_MARKET_DATA_SYMBOLS:BTCUSDT,ETHUSDT,SOLUSDT}
      rest-timeout: ${HELIUM_MARKET_DATA_REST_TIMEOUT:5s}
      reconnect-initial-delay: ${HELIUM_MARKET_DATA_RECONNECT_INITIAL_DELAY:1s}
      reconnect-max-delay: ${HELIUM_MARKET_DATA_RECONNECT_MAX_DELAY:30s}
      cache-ttl: ${HELIUM_MARKET_DATA_CACHE_TTL:20s}
      order-book-limit: ${HELIUM_MARKET_DATA_ORDER_BOOK_LIMIT:100}
      trade-limit: ${HELIUM_MARKET_DATA_TRADE_LIMIT:80}
      candle-limit: ${HELIUM_MARKET_DATA_CANDLE_LIMIT:240}
  compliance:
    sanctions:
      base-url: ${HELIUM_SANCTIONS_BASE_URL:}
      api-token: ${HELIUM_SANCTIONS_API_TOKEN:}
