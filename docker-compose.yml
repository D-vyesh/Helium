name: helium-production-lite

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helium}
      POSTGRES_USER: ${POSTGRES_USER:-helium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helium-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helium} -d ${POSTGRES_DB:-helium}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${HELIUM_REDIS_PASSWORD:-helium-redis-change-me}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${HELIUM_REDIS_PASSWORD:-helium-redis-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/helium-core/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      HELIUM_ENVIRONMENT: ${HELIUM_ENVIRONMENT:-production}
      HELIUM_HTTP_PORT: 8080
      HELIUM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-helium}
      HELIUM_DB_USERNAME: ${POSTGRES_USER:-helium}
      HELIUM_DB_PASSWORD: ${POSTGRES_PASSWORD:-helium-change-me}
      HELIUM_DB_POOL_SIZE: ${HELIUM_DB_POOL_SIZE:-20}
      HELIUM_DB_MAX_LIFETIME_MS: ${HELIUM_DB_MAX_LIFETIME_MS:-1800000}
      HELIUM_REDIS_HOST: redis
      HELIUM_REDIS_PORT: 6379
      HELIUM_REDIS_PASSWORD: ${HELIUM_REDIS_PASSWORD:-helium-redis-change-me}
      HELIUM_REDIS_TIMEOUT: ${HELIUM_REDIS_TIMEOUT:-2s}
      HELIUM_JWT_SECRET: ${HELIUM_JWT_SECRET:-local-development-jwt-secret-change-me-minimum-32-bytes}
      HELIUM_TOTP_ENCRYPTION_KEY: ${HELIUM_TOTP_ENCRYPTION_KEY:-local-totp-encryption-key-32bytes!!}
      HELIUM_SECRETS_BACKEND: ${HELIUM_SECRETS_BACKEND:-environment}
      HELIUM_SECRETS_REFRESH_MS: ${HELIUM_SECRETS_REFRESH_MS:-300000}
      HELIUM_EMAIL_ENABLED: ${HELIUM_EMAIL_ENABLED:-true}
      HELIUM_EMAIL_FROM: ${HELIUM_EMAIL_FROM:-noreply@helium.exchange}
      HELIUM_EMAIL_FROM_NAME: ${HELIUM_EMAIL_FROM_NAME:-HELIUM Exchange}
      HELIUM_EMAIL_BASE_URL: ${HELIUM_EMAIL_BASE_URL:-http://localhost:3000}
      HELIUM_SMTP_HOST: ${HELIUM_SMTP_HOST:-localhost}
      HELIUM_SMTP_PORT: ${HELIUM_SMTP_PORT:-1025}
      HELIUM_SMTP_USERNAME: ${HELIUM_SMTP_USERNAME:-}
      HELIUM_SMTP_PASSWORD: ${HELIUM_SMTP_PASSWORD:-}
      HELIUM_SMTP_AUTH: ${HELIUM_SMTP_AUTH:-false}
      HELIUM_SMTP_STARTTLS: ${HELIUM_SMTP_STARTTLS:-false}
      HELIUM_API_KEY_PEPPER: ${HELIUM_API_KEY_PEPPER:-change-me-before-production}
      HELIUM_API_KEY_PREVIOUS_PEPPER: ${HELIUM_API_KEY_PREVIOUS_PEPPER:-}
      HELIUM_API_KEY_VERSION: ${HELIUM_API_KEY_VERSION:-v1}
      HELIUM_API_KEY_PREVIOUS_VERSION: ${HELIUM_API_KEY_PREVIOUS_VERSION:-}
      HELIUM_API_KEY_SIGNATURE_TTL: ${HELIUM_API_KEY_SIGNATURE_TTL:-5m}
      HELIUM_API_KEY_NONCE_TTL: ${HELIUM_API_KEY_NONCE_TTL:-10m}
      HELIUM_API_KEY_DEFAULT_LIFETIME: ${HELIUM_API_KEY_DEFAULT_LIFETIME:-90d}
      HELIUM_OUTBOX_ENABLED: ${HELIUM_OUTBOX_ENABLED:-true}
      HELIUM_OUTBOX_POLL_INTERVAL_MS: ${HELIUM_OUTBOX_POLL_INTERVAL_MS:-1000}
      HELIUM_TRACE_SAMPLING_PROBABILITY: ${HELIUM_TRACE_SAMPLING_PROBABILITY:-0.10}
      HELIUM_OTLP_ENDPOINT: ${HELIUM_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      HELIUM_BTC_RPC_NODES: ${HELIUM_BTC_RPC_NODES:-}
      HELIUM_ETH_RPC_NODES: ${HELIUM_ETH_RPC_NODES:-}
      HELIUM_SOL_RPC_NODES: ${HELIUM_SOL_RPC_NODES:-}
      HELIUM_WALLET_RPC_FAILURE_THRESHOLD: ${HELIUM_WALLET_RPC_FAILURE_THRESHOLD:-3}
      HELIUM_WALLET_RPC_RECOVERY_TIMEOUT_MS: ${HELIUM_WALLET_RPC_RECOVERY_TIMEOUT_MS:-30000}
      HELIUM_WALLET_RPC_STALE_BLOCK_LAG: ${HELIUM_WALLET_RPC_STALE_BLOCK_LAG:-6}
      HELIUM_WALLET_RPC_HEALTH_MONITOR_ENABLED: ${HELIUM_WALLET_RPC_HEALTH_MONITOR_ENABLED:-true}
      HELIUM_WALLET_RPC_HEALTH_MONITOR_POLL_INTERVAL_MS: ${HELIUM_WALLET_RPC_HEALTH_MONITOR_POLL_INTERVAL_MS:-30000}
      HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_ENABLED: ${HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_ENABLED:-true}
      HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_POLL_INTERVAL_MS: ${HELIUM_WALLET_RPC_CONSISTENCY_MONITOR_POLL_INTERVAL_MS:-30000}
      HELIUM_WALLET_RPC_CONSISTENCY_ALLOWED_BLOCK_LAG: ${HELIUM_WALLET_RPC_CONSISTENCY_ALLOWED_BLOCK_LAG:-3}
      HELIUM_WALLET_BLOCKCHAIN_CONSENSUS_MINIMUM_HEALTHY_PROVIDERS: ${HELIUM_WALLET_BLOCKCHAIN_CONSENSUS_MINIMUM_HEALTHY_PROVIDERS:-1}
      HELIUM_WALLET_BLOCKCHAIN_CONSENSUS_MINIMUM_AGREEMENT: ${HELIUM_WALLET_BLOCKCHAIN_CONSENSUS_MINIMUM_AGREEMENT:-1}
      HELIUM_WALLET_CHAIN_MONITOR_ENABLED: ${HELIUM_WALLET_CHAIN_MONITOR_ENABLED:-false}
      HELIUM_ETH_CUSTODY_ADDRESS: ${HELIUM_ETH_CUSTODY_ADDRESS:-}
      HELIUM_SOL_FEE_PAYER: ${HELIUM_SOL_FEE_PAYER:-}
      HELIUM_VAULT_ADDRESS: ${HELIUM_VAULT_ADDRESS:-}
      HELIUM_VAULT_TOKEN: ${HELIUM_VAULT_TOKEN:-}
      HELIUM_OFFLINE_CUSTODY_RESPONSE_DIRECTORY: ${HELIUM_OFFLINE_CUSTODY_RESPONSE_DIRECTORY:-}
      HELIUM_CUSTODY_SIGNING_MAX_RETRIES: ${HELIUM_CUSTODY_SIGNING_MAX_RETRIES:-5}
      HELIUM_CUSTODY_SIGNING_WORKER_ENABLED: ${HELIUM_CUSTODY_SIGNING_WORKER_ENABLED:-false}
      HELIUM_CUSTODY_SIGNING_POLL_INTERVAL_MS: ${HELIUM_CUSTODY_SIGNING_POLL_INTERVAL_MS:-5000}
      HELIUM_WALLET_BUILDER_WORKER_ENABLED: ${HELIUM_WALLET_BUILDER_WORKER_ENABLED:-false}
      HELIUM_WALLET_BUILDER_POLL_INTERVAL_MS: ${HELIUM_WALLET_BUILDER_POLL_INTERVAL_MS:-5000}
      HELIUM_WALLET_BROADCAST_WORKER_ENABLED: ${HELIUM_WALLET_BROADCAST_WORKER_ENABLED:-false}
      HELIUM_WALLET_BROADCAST_POLL_INTERVAL_MS: ${HELIUM_WALLET_BROADCAST_POLL_INTERVAL_MS:-5000}
      HELIUM_WALLET_BROADCAST_MAX_RETRIES: ${HELIUM_WALLET_BROADCAST_MAX_RETRIES:-5}
      HELIUM_WALLET_CONFIRMATION_WORKER_ENABLED: ${HELIUM_WALLET_CONFIRMATION_WORKER_ENABLED:-false}
      HELIUM_WALLET_CONFIRMATION_POLL_INTERVAL_MS: ${HELIUM_WALLET_CONFIRMATION_POLL_INTERVAL_MS:-15000}
      HELIUM_WALLET_STUCK_MONITOR_ENABLED: ${HELIUM_WALLET_STUCK_MONITOR_ENABLED:-false}
      HELIUM_WALLET_STUCK_MONITOR_POLL_INTERVAL_MS: ${HELIUM_WALLET_STUCK_MONITOR_POLL_INTERVAL_MS:-600000}
      HELIUM_WALLET_STUCK_MONITOR_THRESHOLD_MINUTES: ${HELIUM_WALLET_STUCK_MONITOR_THRESHOLD_MINUTES:-60}
      HELIUM_SOLANA_BROADCAST_SKIP_PREFLIGHT: ${HELIUM_SOLANA_BROADCAST_SKIP_PREFLIGHT:-false}
      HELIUM_SOLANA_BROADCAST_COMMITMENT: ${HELIUM_SOLANA_BROADCAST_COMMITMENT:-processed}
      HELIUM_MARKET_DATA_LIVE_ENABLED: ${HELIUM_MARKET_DATA_LIVE_ENABLED:-true}
      HELIUM_BINANCE_REST_BASE_URL: ${HELIUM_BINANCE_REST_BASE_URL:-https://api.binance.com}
      HELIUM_BINANCE_WS_BASE_URL: ${HELIUM_BINANCE_WS_BASE_URL:-wss://stream.binance.com:9443}
      HELIUM_MARKET_DATA_SYMBOLS: ${HELIUM_MARKET_DATA_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      HELIUM_MARKET_DATA_REST_TIMEOUT: ${HELIUM_MARKET_DATA_REST_TIMEOUT:-5s}
      HELIUM_MARKET_DATA_RECONNECT_INITIAL_DELAY: ${HELIUM_MARKET_DATA_RECONNECT_INITIAL_DELAY:-1s}
      HELIUM_MARKET_DATA_RECONNECT_MAX_DELAY: ${HELIUM_MARKET_DATA_RECONNECT_MAX_DELAY:-30s}
      HELIUM_MARKET_DATA_CACHE_TTL: ${HELIUM_MARKET_DATA_CACHE_TTL:-20s}
      HELIUM_MARKET_DATA_ORDER_BOOK_LIMIT: ${HELIUM_MARKET_DATA_ORDER_BOOK_LIMIT:-100}
      HELIUM_MARKET_DATA_TRADE_LIMIT: ${HELIUM_MARKET_DATA_TRADE_LIMIT:-80}
      HELIUM_MARKET_DATA_CANDLE_LIMIT: ${HELIUM_MARKET_DATA_CANDLE_LIMIT:-240}
      HELIUM_MARKET_DATA_REST_REFRESH_MS: ${HELIUM_MARKET_DATA_REST_REFRESH_MS:-30000}
      HELIUM_PRICE_ALERT_EVALUATION_MS: ${HELIUM_PRICE_ALERT_EVALUATION_MS:-15000}
      HELIUM_LOG_LEVEL: ${HELIUM_LOG_LEVEL:-INFO}
    ports:
      - "${HELIUM_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-HELIUM}
        NEXT_PUBLIC_HELIUM_API_BASE_URL: ${NEXT_PUBLIC_HELIUM_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_HELIUM_WS_BASE_URL: ${NEXT_PUBLIC_HELIUM_WS_BASE_URL:-ws://localhost:8080}
    environment:
      NEXT_PUBLIC_HELIUM_API_BASE_URL: ${NEXT_PUBLIC_HELIUM_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_HELIUM_WS_BASE_URL: ${NEXT_PUBLIC_HELIUM_WS_BASE_URL:-ws://localhost:8080}
    ports:
      - "${HELIUM_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    profiles: ["dev", "mail"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.54
    profiles: ["monitoring"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    profiles: ["monitoring"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/monitoring/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317"
      - "4318"
    depends_on:
      - jaeger

volumes:
  postgres-data:
  redis-data:
